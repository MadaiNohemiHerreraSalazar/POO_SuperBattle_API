# Nombre de la aplicacion (aparece en los logs)
spring.application.name=herois

# --- Banco de datos H2 ---
# Guarda los datos en un archivo dentro de la carpeta del proyecto (./data/herois.mv.db)
# Asi los datos NO se pierden cuando paren y prendan la aplicacion de nuevo
spring.datasource.url=jdbc:h2:file:./data/herois
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea/actualiza las tablas automaticamente en base a las Entities (@Entity)
spring.jpa.hibernate.ddl-auto=update

# Muestra el SQL generado en la consola - bueno para aprender y debuggear
spring.jpa.show-sql=true

# Consola visual del H2, accesible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Apaga el cache del Thymeleaf: asi al editar un HTML, solo hay que refrescar el navegador
spring.thymeleaf.cache=false